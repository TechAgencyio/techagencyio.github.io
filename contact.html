<form action="https://formspree.io/f/maenrrdq" method="POST">

    <div class="grid grid-2" style="gap: 1.5rem; margin-bottom: 0;">
        <div class="form-group">
            <label for="name">Name *</label>
            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                required
            >
        </div>

        <div class="form-group">
            <label for="company">Company</label>
            <input
                type="text"
                id="company"
                name="company"
                class="form-control"
            >
        </div>
    </div>

    <div class="grid grid-2" style="gap: 1.5rem; margin-bottom: 0;">
        <div class="form-group">
            <label for="email">Email *</label>
            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                class="form-control"
            >
        </div>
    </div>

    <div class="grid grid-2" style="gap: 1.5rem; margin-bottom: 0;">
        <div class="form-group">
            <label for="budget">Project Budget</label>
            <select
                id="budget"
                name="budget"
                class="form-control"
            >
                <option value="">Select Budget</option>
                <option value="under5k">Under $5k</option>
                <option value="5k-15k">$5k - $15k</option>
                <option value="15k-50k">$15k - $50k</option>
                <option value="50k+">$50k+</option>
            </select>
        </div>

        <div class="form-group">
            <label for="timeline">Timeline</label>
            <select
                id="timeline"
                name="timeline"
                class="form-control"
            >
                <option value="">Select Timeline</option>
                <option value="1mo">< 1 Month</option>
                <option value="1-3mo">1-3 Months</option>
                <option value="3-6mo">3-6 Months</option>
                <option value="flexible">Flexible</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="message">Project Description *</label>
        <textarea
            id="message"
            name="message"
            class="form-control"
            required
        ></textarea>
    </div>

    <input type="hidden" name="_subject" value="New TechAgency Website Inquiry">

    <button
        type="submit"
        class="btn btn-primary"
        style="width: 100%; margin-top: 1rem; justify-content: center;"
    >
        Send Request
    </button>

</form>
